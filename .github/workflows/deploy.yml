# CI/CD de tracking: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-tracking además despliega.
name: CI-CD tracking

on:
  push:
    branches: [main]
    paths: ["tracking/**", "common/**", "requirements.txt", "Dockerfile", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["tracking/**", "common/**", "requirements.txt", "Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: tracking
      directorio: "."
      imagen: ghcr.io/kevinso4/logitrack-tracking
      desplegar: true
      url: https://tracklogi-tracking.onrender.com
      render-service-id: srv-daqqfod9fdbs73c06770
    secrets: inherit
